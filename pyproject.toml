[project]
name = "chatbot-agent"
version = "0.1.0"
description = "A small chatbot agent with a bounded LangGraph workflow and a FastAPI API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.2.0,<2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.0,<2",
    "langsmith>=0.3.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.6.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_agent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/chatbot_agent/api/routes/chat.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["chatbot_agent", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["chatbot_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.uv]
package = true
